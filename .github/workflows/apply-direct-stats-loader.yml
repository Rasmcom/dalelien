name: Apply direct statistics loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-direct-stats-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index loader safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          head_old = '</head>'
          head_new = '  <link rel="stylesheet" href="site-stats.css?v=20260819-2">\n</head>'
          if 'site-stats.css?v=20260819-2' not in s:
              assert head_old in s, 'index head marker not found'
              s = s.replace(head_old, head_new, 1)

          scripts_old = '<script src="data/catalog.js"></script>\n<script src="app.js?v=20260819-4"></script>'
          scripts_new = '<script src="data/catalog.js?v=20260819-3"></script>\n<script src="site-stats.js?v=20260819-2"></script>\n<script src="app.js?v=20260819-5"></script>'
          assert scripts_old in s, 'expected old script block not found'
          s = s.replace(scripts_old, scripts_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit direct loader
        run: |
          git config user.name "stats-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: load site statistics directly"
          git push
