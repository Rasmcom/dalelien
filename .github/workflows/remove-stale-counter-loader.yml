name: Remove stale counter loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-stale-counter-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale site stats loader from current catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('data/catalog.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\n    if\(!document\.querySelector\('link\[data-ien-site-stats\]'\)\)\{.*?\n    \}\n    if\(!document\.querySelector\('script\[data-ien-site-stats\]'\)\)\{.*?\n    \}",
              re.S,
          )
          s2, count = pattern.subn('', s, count=1)
          assert count == 1, f'expected one stale site-stats loader, found {count}'
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cleaned catalog
        run: |
          git config user.name "counter-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.js
          git diff --cached --quiet || git commit -m "fix: remove stale visitor counter loader"
          git push
