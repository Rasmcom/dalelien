name: Apply statistics v4 cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stats-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump statistics asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='site-stats.css?v=20260819-2'
          old_js='site-stats.js?v=20260819-3'
          assert old_css in s, 'old statistics CSS version not found'
          assert old_js in s, 'old statistics JS version not found'
          s=s.replace(old_css,'site-stats.css?v=20260819-3',1)
          s=s.replace(old_js,'site-stats.js?v=20260819-4',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "stats-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: refresh separated visitor statistics"
          git push
