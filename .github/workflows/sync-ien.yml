name: Sync IEN guides

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'sync/**'
      - 'package.json'
      - '.github/workflows/sync-ien.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ien-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve IEN www endpoint
        shell: bash
        run: |
          set -euo pipefail
          if getent ahostsv4 www.ien.edu.sa >/dev/null 2>&1; then
            echo "www.ien.edu.sa resolves normally."
            exit 0
          fi

          mapfile -t IPS < <(getent ahostsv4 ien.edu.sa | awk '$2 == "STREAM" {print $1}' | sort -u)
          [ "${#IPS[@]}" -gt 0 ] || { echo "No IPv4 addresses found for ien.edu.sa" >&2; exit 1; }

          SELECTED=""
          for ip in "${IPS[@]}"; do
            code=$(curl --resolve "www.ien.edu.sa:443:${ip}" --connect-timeout 3 --max-time 8 -sS -o /dev/null -w '%{http_code}' 'https://www.ien.edu.sa/?choice=2#/generalactivities/' || true)
            echo "Testing ${ip}: HTTP ${code}"
            if [[ "$code" =~ ^[23] ]]; then SELECTED="$ip"; break; fi
          done

          [ -n "$SELECTED" ] || { echo "Could not find a working IEN endpoint" >&2; exit 1; }
          echo "$SELECTED www.ien.edu.sa" | sudo tee -a /etc/hosts
          echo "Mapped www.ien.edu.sa -> $SELECTED"

      - name: Sync official IEN PDF guides via API
        run: npm run sync

      - name: Commit refreshed catalog
        run: |
          git config user.name "ien-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/catalog.js data/ien-diagnostics.json
          git diff --cached --quiet || git commit -m "chore: sync IEN PDF guides"
          git push

  deploy:
    needs: sync
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
