name: Sync IEN guides
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Sync official PDF links
        run: npm run sync
      - name: Commit catalog changes
        run: |
          git config user.name "ien-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/catalog.js
          git diff --cached --quiet || git commit -m "chore: sync IEN guides"
          git push
