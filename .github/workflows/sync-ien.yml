name: Sync IEN guides

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync/**'
      - 'package.json'
      - '.github/workflows/sync-ien.yml'
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ien-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync official IEN links
        run: npm run sync

      - name: Commit catalog and diagnostics
        run: |
          git config user.name "ien-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/catalog.js data/ien-diagnostics.json
          git diff --cached --quiet || git commit -m "chore: sync IEN guides"
          git push

  deploy:
    needs: sync
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4