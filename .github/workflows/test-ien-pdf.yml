name: Test IEN PDF download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ien-pdf.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test one PDF
        shell: bash
        run: |
          set +e
          curl --resolve "iencontent.ien.edu.sa:443:20.74.132.239" \
            -L --fail --connect-timeout 5 --max-time 20 \
            -A "Mozilla/5.0" -e "https://www.ien.edu.sa/" \
            -D /tmp/headers.txt -o /tmp/test.pdf \
            "https://iencontent.ien.edu.sa/books/cybersecurity-112-v2.pdf"
          code=$?
          size=$(stat -c%s /tmp/test.pdf 2>/dev/null || echo 0)
          printf "exit=%s\nsize=%s\n" "$code" "$size" > data/ien-pdf-test.txt
          cat /tmp/headers.txt >> data/ien-pdf-test.txt 2>/dev/null || true
          cat data/ien-pdf-test.txt
      - name: Commit result
        run: |
          git config user.name "ien-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ien-pdf-test.txt
          git commit -m "chore: test IEN PDF download"
          git push
