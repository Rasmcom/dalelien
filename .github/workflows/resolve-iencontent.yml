name: Resolve IEN content host
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-iencontent.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve host
        shell: bash
        run: |
          getent ahostsv4 iencontent.ien.edu.sa | awk '$2=="STREAM"{print $1}' | sort -u > data/iencontent-ips.txt
          cat data/iencontent-ips.txt
      - name: Commit result
        run: |
          git config user.name "ien-resolve-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/iencontent-ips.txt
          git commit -m "chore: resolve IEN content host"
          git push
