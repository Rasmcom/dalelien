name: IEN fast discovery

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  discover:
    if: startsWith(github.event.issue.title, '[discover]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Resolve IEN www endpoint
        shell: bash
        run: |
          set -euo pipefail
          if ! getent ahostsv4 www.ien.edu.sa >/dev/null 2>&1; then
            mapfile -t IPS < <(getent ahostsv4 ien.edu.sa | awk '$2 == "STREAM" {print $1}' | sort -u)
            SELECTED=""
            for ip in "${IPS[@]}"; do
              code=$(curl --resolve "www.ien.edu.sa:443:${ip}" --connect-timeout 3 --max-time 8 -sS -o /dev/null -w '%{http_code}' 'https://www.ien.edu.sa/?choice=2#/generalactivities/' || true)
              if [[ "$code" =~ ^[23] ]]; then SELECTED="$ip"; break; fi
            done
            [ -n "$SELECTED" ] || exit 1
            echo "$SELECTED www.ien.edu.sa" | sudo tee -a /etc/hosts
          fi
      - name: Discover IEN network
        env:
          IEN_URL: https://www.ien.edu.sa/?choice=2#/generalactivities/
        run: node sync/discover-ien.mjs
      - name: Commit discovery
        run: |
          git config user.name "ien-discovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ien-discovery.json
          git diff --cached --quiet || git commit -m "chore: discover IEN network"
          git push
