name: Apply mobile visual cache fix

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-visual-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch cache versions and stage typography
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')
          s = s.replace("branding.css?v=20260819-1", "branding.css?v=20260819-4")
          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('<script src="app.js"></script>', '<script src="app.js?v=20260819-4"></script>')
          index.write_text(h, encoding='utf-8')

          css = Path('branding.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* stage typography + clean animated icon plates v4 */'
          if marker not in c:
              c += '''\n\n/* stage typography + clean animated icon plates v4 */\n.stage-icon{background-color:#fff!important}\n.field[data-field]::after{background-color:#fff!important}\n.stage strong{font-size:18px!important;line-height:1.45!important;font-weight:800!important}\n.stage small{font-size:11px!important;line-height:1.75!important;margin-top:6px!important;color:#7f8da1!important}\n.stage-count{font-size:10.5px!important;line-height:1.3!important;font-weight:700!important;color:#7e8da2!important}\n@media(max-width:720px){\n  .stage strong{font-size:18px!important}\n  .stage small{font-size:11px!important}\n  .stage-count{font-size:10.5px!important}\n}\n'''
          css.write_text(c, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html branding.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: bust mobile cache and improve stage readability"
            git push origin main
          fi
