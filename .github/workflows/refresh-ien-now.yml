name: Refresh IEN now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-ien-now.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve IEN www endpoint
        shell: bash
        run: |
          set -euo pipefail
          if getent ahostsv4 www.ien.edu.sa >/dev/null 2>&1; then
            echo "www.ien.edu.sa resolves normally."
            exit 0
          fi

          mapfile -t IPS < <(getent ahostsv4 ien.edu.sa | awk '$2 == "STREAM" {print $1}' | sort -u)
          [ "${#IPS[@]}" -gt 0 ] || { echo "No IPv4 addresses found for ien.edu.sa" >&2; exit 1; }

          SELECTED=""
          for ip in "${IPS[@]}"; do
            code=$(curl --resolve "www.ien.edu.sa:443:${ip}" --connect-timeout 3 --max-time 8 -sS -o /dev/null -w '%{http_code}' 'https://www.ien.edu.sa/?choice=2#/generalactivities/' || true)
            echo "Testing ${ip}: HTTP ${code}"
            if [[ "$code" =~ ^[23] ]]; then SELECTED="$ip"; break; fi
          done

          [ -n "$SELECTED" ] || { echo "Could not find a working IEN endpoint" >&2; exit 1; }
          echo "$SELECTED www.ien.edu.sa" | sudo tee -a /etc/hosts

      - name: Refresh official IEN links
        run: npm run sync

      - name: Commit refreshed catalog
        run: |
          git config user.name "ien-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json data/catalog.js data/ien-diagnostics.json
          git diff --cached --quiet || git commit -m "chore: refresh IEN links now"
          git push
