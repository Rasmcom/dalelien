name: Probe IEN competition categories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ien-competitions.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe official IEN API
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const api='https://www.ien.edu.sa/api/MediaContent/GetMediaContents';
          const ids=[8,81,82,83,84,85,811,812,813,814,821,822,823,824,831,832,833,834,841,842,843,844,851,852,853,854];
          const out=[];
          for (const id of ids) {
            try {
              const res=await fetch(api,{
                method:'POST',
                headers:{'content-type':'application/json;charset=UTF-8','accept':'application/json, text/plain, */*','referer':'https://www.ien.edu.sa/?choice=2#/generalactivities/8','user-agent':'Mozilla/5.0'},
                body:JSON.stringify({CategoryId:id,StageId:'0'})
              });
              const data=await res.json();
              out.push({categoryId:id,status:res.status,count:Array.isArray(data)?data.length:null,items:Array.isArray(data)?data.slice(0,10).map(x=>({id:x.id,title:x.title,downloadUrl:x.downloadUrl,linkOrPath:x.linkOrPath})):data});
            } catch (e) { out.push({categoryId:id,error:String(e)}); }
          }
          fs.writeFileSync('data/competition-probe.json',JSON.stringify(out,null,2));
          NODE
      - name: Commit probe
        run: |
          git config user.name "ien-probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/competition-probe.json
          git commit -m "chore: probe IEN competition categories"
          git push
