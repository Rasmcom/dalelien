name: Actions smoke test

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  smoke:
    if: startsWith(github.event.issue.title, '[smoke]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write marker
        run: |
          mkdir -p data
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > data/action-smoke.txt
      - name: Commit marker
        run: |
          git config user.name "actions-smoke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/action-smoke.txt
          git commit -m "chore: actions smoke test"
          git push
