name: IEN network probe

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[netprobe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe IEN DNS and HTTPS
        shell: bash
        run: |
          set +e
          mkdir -p data
          OUT=data/ien-network-probe.txt
          : > "$OUT"
          {
            echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== getent ien.edu.sa ==='
            getent ahostsv4 ien.edu.sa
            echo "exit=$?"
            echo
            echo '=== getent www.ien.edu.sa ==='
            getent ahostsv4 www.ien.edu.sa
            echo "exit=$?"
            echo
            echo '=== Google DoH ien.edu.sa ==='
            curl -L --max-time 15 -sS -H 'accept: application/dns-json' 'https://dns.google/resolve?name=ien.edu.sa&type=A'
            echo
            echo "exit=$?"
            echo
            echo '=== Google DoH www.ien.edu.sa ==='
            curl -L --max-time 15 -sS -H 'accept: application/dns-json' 'https://dns.google/resolve?name=www.ien.edu.sa&type=A'
            echo
            echo "exit=$?"
            echo
            echo '=== direct www tests over apex IPv4 addresses ==='
          } >> "$OUT" 2>&1

          mapfile -t IPS < <(getent ahostsv4 ien.edu.sa | awk '$2 == "STREAM" {print $1}' | sort -u)
          TMP=$(mktemp -d)
          for ip in "${IPS[@]}"; do
            (
              result=$(curl --resolve "www.ien.edu.sa:443:${ip}" --connect-timeout 3 --max-time 8 -sS -o /dev/null -w "ip=${ip} code=%{http_code} remote=%{remote_ip} final=%{url_effective}" 'https://www.ien.edu.sa/?choice=2#/generalactivities/' 2>&1)
              ec=$?
              printf '%s exit=%s\n' "$result" "$ec" > "$TMP/${ip}.txt"
            ) &
          done
          wait
          cat "$TMP"/*.txt | sort >> "$OUT"
          rm -rf "$TMP"
      - name: Commit probe
        run: |
          git config user.name "ien-network-probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/ien-network-probe.txt
          git diff --cached --quiet || git commit -m "chore: probe IEN network"
          git push
