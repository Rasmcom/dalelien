name: IEN network probe

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[netprobe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe IEN DNS and HTTPS
        shell: bash
        run: |
          set +e
          mkdir -p data
          {
            echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '=== getent ien.edu.sa ==='
            getent ahostsv4 ien.edu.sa
            echo "exit=$?"
            echo
            echo '=== getent www.ien.edu.sa ==='
            getent ahostsv4 www.ien.edu.sa
            echo "exit=$?"
            echo
            echo '=== Google DoH ien.edu.sa ==='
            curl -L --max-time 15 -sS -H 'accept: application/dns-json' 'https://dns.google/resolve?name=ien.edu.sa&type=A'
            echo
            echo "exit=$?"
            echo
            echo '=== Google DoH www.ien.edu.sa ==='
            curl -L --max-time 15 -sS -H 'accept: application/dns-json' 'https://dns.google/resolve?name=www.ien.edu.sa&type=A'
            echo
            echo "exit=$?"
            echo
            echo '=== HTTPS ien.edu.sa ==='
            curl -L -I --max-time 20 -sS -o /dev/null -w 'code=%{http_code} final=%{url_effective} remote=%{remote_ip}\n' 'https://ien.edu.sa/?choice=2#/generalactivities/'
            echo "exit=$?"
            echo
            echo '=== HTTPS www.ien.edu.sa ==='
            curl -L -I --max-time 20 -sS -o /dev/null -w 'code=%{http_code} final=%{url_effective} remote=%{remote_ip}\n' 'https://www.ien.edu.sa/?choice=2#/generalactivities/'
            echo "exit=$?"
          } > data/ien-network-probe.txt 2>&1
      - name: Commit probe
        run: |
          git config user.name "ien-network-probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/ien-network-probe.txt
          git commit -m "chore: probe IEN network"
          git push
