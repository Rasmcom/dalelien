name: IEN API probe

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[apiprobe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve IEN www endpoint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t IPS < <(getent ahostsv4 ien.edu.sa | awk '$2 == "STREAM" {print $1}' | sort -u)
          SELECTED=""
          for ip in "${IPS[@]}"; do
            code=$(curl --resolve "www.ien.edu.sa:443:${ip}" --connect-timeout 3 --max-time 8 -sS -o /dev/null -w '%{http_code}' 'https://www.ien.edu.sa/?choice=2#/generalactivities/' || true)
            if [[ "$code" =~ ^[23] ]]; then SELECTED="$ip"; break; fi
          done
          [ -n "$SELECTED" ] || exit 1
          echo "$SELECTED www.ien.edu.sa" | sudo tee -a /etc/hosts
      - name: Fetch stage-specific activity API data
        shell: bash
        run: |
          set +e
          mkdir -p data/ien-api/stages
          endpoint='https://www.ien.edu.sa/api/MediaContent/GetMediaContents'
          categories=(111 112 113 114 221 222 223 224 331 332 333 334 411 412 413 414 511 512 513 514)
          : > data/ien-api/stages/status.txt
          for category in "${categories[@]}"; do
            body="data/ien-api/stages/category-${category}.json"
            code=$(curl -sS --max-time 45 \
              -o "$body" -w '%{http_code}' \
              -H 'Content-Type: application/json;charset=UTF-8' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Referer: https://www.ien.edu.sa/?choice=2#/generalactivities/' \
              --data "{\"CategoryId\":${category},\"StageId\":\"0\"}" \
              "$endpoint")
            ec=$?
            printf 'category=%s http=%s exit=%s bytes=%s\n' "$category" "$code" "$ec" "$(wc -c < "$body" 2>/dev/null || echo 0)" >> data/ien-api/stages/status.txt
          done
          exit 0
      - name: Commit API samples
        run: |
          git config user.name "ien-api-probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/ien-api
          git diff --cached --quiet || git commit -m "chore: capture IEN stage activity API samples"
          git push
